<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>King Cobra</title>
  <style>
    :root {
      --bg: #05080a;
      --fg: #d8f5e4;
      --ac: #c0262d;
      box-sizing: border-box
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #05080a
      }
    }

    html,
    body {
      margin: 0;
      background: radial-gradient(ellipse at 50% 60%, #26241c 0%, #12110d 45%, #060605 100%) fixed;
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
      cursor: pointer
    }

    #sp {
      height: 280vh
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0;
      text-align: center;
      pointer-events: none
    }

    .hud h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--ac)
    }

    .hud p {
      margin: 6px 0 0;
      font-size: .85rem;
      opacity: .7
    }

    .hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      font-size: .7rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--fg)
    }

    .hint i {
      width: 16px;
      height: 16px;
      border-right: 2px solid var(--ac);
      border-bottom: 2px solid var(--ac);
      transform: rotate(45deg);
      animation: bob 1.4s ease-in-out infinite
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0) rotate(45deg);
        opacity: .35
      }

      50% {
        transform: translateY(8px) rotate(45deg);
        opacity: 1
      }
    }
  </style>
</head>
